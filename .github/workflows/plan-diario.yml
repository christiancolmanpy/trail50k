name: Plan del día por Telegram

on:
  schedule:
    - cron: "30 8 * * *"   # 08:30 UTC = 05:30 Asunción
  workflow_dispatch:        # permite dispararlo a mano desde la pestaña Actions

jobs:
  enviar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Enviar plan de hoy
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          APP_URL: https://claude.ai/artifact/HBrKi65AhfwXYLFdzbKxHy
        run: python3 -I enviar_plan_telegram.py
